# Development: docker compose -f compose.dev.yml up --build
name: uitzet-tracker-dev

services:
  uitzet-tracker-dev:
    build:
      context: .
      target: dev
    ports:
      - "${PORT:-5173}:5173"
    environment:
      # File events over a macOS bind mount get dropped, so let Vite's watcher poll
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
